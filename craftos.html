              <div style="font-size:14px;font-weight:800;letter-spacing:-.025em;margin-top:5px">${j.title}</div>
              <div class="job-site">${j.site}</div>
            </div>
            <span class="badge b-${j.statusKind}" style="background:rgba(255,255,255,.16);color:#fff">${j.status}</span>
          </div>
          ${j.action
            ? `<div class="alert-strip act">${ic('alert',14,2.3)} Action required · confirmation requests <span class="n">${j.action}</span></div>`
            : `<div class="alert-strip ok">${ic('checkCirc',14,2.3)} No confirmation action required</div>`}
          <div class="job-body">
            <div class="kv"><dt>${j.roster}</dt><dd>${fmt(j.start[0],j.start[1],j.start[2])} – ${fmt(j.end[0],j.end[1],j.end[2])}</dd></div>
            ${j.mob?`<div class="kv"><dt>Days to mob</dt><dd class="hl">${j.mob}</dd></div>`:''}
          </div>
          <div class="job-foot">
            <span class="small grow">${j.role}</span>
            <button class="circ-btn grn" onclick="askAboutJob('${j.id}')" title="Ask a question">${ic('chat',16)}</button>
            <button class="circ-btn red" onclick="openJob('${j.id}')" title="Open job">${ic('chevR',16)}</button>
          </div>
        </div>`).join('') || emptyState('list','No rosters','Nothing matches this filter right now.')}
    </div>
    <div class="tc" style="padding-bottom:22px">
      <button class="link-muted" onclick="toast('Archived rosters would open here.','info')">View archive</button>
    </div>
  </div>`;
};
function emptyState(icon,title,text){
  return `<div class="empty"><div class="empty-ic">${ic(icon,28)}</div><h4>${title}</h4><p>${text}</p></div>`;
}

/* ============ NOTIFICATIONS ============ */
function setNotifTab(t){ S.notifTab=t; render(); }
function setNotifFilter(k){ S.notifFilter=k; render(); }
function markRead(id){
  const n=NOTIFS.find(x=>x.id===id); if(n&&!n.read){ n.read=true; S.unread=NOTIFS.filter(x=>!x.read).length; }
  render(); toast('Marked as read.','ok',null,1800);
}
function markAllRead(){
  NOTIFS.forEach(n=>n.read=true); S.unread=0; render(); toast('All notifications marked as read.','ok');
}
TABS.notifications=function(){
  const unreadN=NOTIFS.filter(n=>!n.read).length, readN=NOTIFS.filter(n=>n.read).length;
  let list=NOTIFS.filter(n=> S.notifTab==='unread' ? !n.read : n.read);
  const totalInTab=list.length;
  if(S.notifFilter!=='all') list=list.filter(n=>n.cat===S.notifFilter);
  const lbl=(NOTIF_FILTERS.find(f=>f[0]===S.notifFilter)||[])[1]||'All';
  return `
  ${appbar({ title:'Alerts', sub:'Notifications that need your attention',
    right:`<button class="icon-btn" aria-label="Mark all as read" title="Mark all as read" onclick="markAllRead()">${ic('checkCirc',20)}</button>` })}
  <div class="filterbar">
    <div class="seg">
      <button class="seg-btn ${S.notifTab==='unread'?'on':''}" onclick="setNotifTab('unread')">Unread<span class="cnt">${unreadN}</span></button>
      <button class="seg-btn ${S.notifTab==='read'?'on':''}" onclick="setNotifTab('read')">Read<span class="cnt">${readN}</span></button>
    </div>
    ${ddFilter('ntF','Type',NOTIF_FILTERS,S.notifFilter,'setNotifFilter')}
  </div>
  ${list.length!==totalInTab?resultLine(list.length,totalInTab,lbl):''}
  <div class="scroll">
    <div style="padding:0 16px 20px" class="stack gap12">
      ${list.map(n=>`
        <div class="nt ${n.read?'':'unread'}">
          <div class="nt-top">
            <span class="nt-when">Sent ${n.when}</span>
            <span class="nt-rel">Relates to <span class="tag">${n.rel}</span></span>
          </div>
          <div class="nt-body">
            <div class="nt-title">${n.title}</div>
            <div class="nt-text">${esc(n.body).replace(/\n\n/g,'<br><br>')}</div>
          </div>
          <div class="nt-foot">
            <button class="circ-btn grn" onclick="newConversation('${esc(n.title)}')" title="Ask about this">${ic('chat',15)}</button>
            <button class="circ-btn red" onclick="toast('This would open the related record.','info')" title="Go to record">${ic('chevR',15)}</button>
            <span class="grow"></span>
            ${n.read?`<span class="badge b-gry">Read</span>`
                    :`<button class="btn btn-xs btn-outline" onclick="markRead(${n.id})">Mark read</button>`}
          </div>
        </div>`).join('') || emptyState('bell','Nothing here','No notifications match this filter.')}
    </div>
  </div>`;
};

/* ============ MESSAGES ============ */
function setMsgFilter(k){ S.msgFilter=k; render(); }
function openThread(id){ S.activeThread=id; const t=THREADS.find(x=>x.id===id); if(t) t.unread=0; render(); }
TABS.messages=function(){
  if(S.activeThread) return threadView();
  let list=THREADS.filter(t=>S.msgFilter==='all'?true:t.state===S.msgFilter);
  const q=(S.msgQuery||'').toLowerCase();
  if(q) list=list.filter(t=>(t.subject+t.dept).toLowerCase().includes(q));
  return `
  ${appbar({ title:'Messages', sub:'Support conversations with the office',
    })}
  <div style="padding:0 16px 12px">
    <div class="input-wrap">
      <span class="input-ic">${ic('search',17)}</span>
      <input class="input has-ic" id="liveSearch" style="height:44px" placeholder="Search conversations"
             value="${esc(S.msgQuery||'')}" oninput="liveFilter(this,'msgQuery')">
    </div>
  </div>
  <div class="filterbar">
    <div class="seg">
      ${[['all','All'],['open','Open'],['closed','Closed']].map(([k,t])=>
        `<button class="seg-btn ${S.msgFilter===k?'on':''}" onclick="setMsgFilter('${k}')">${t}</button>`).join('')}
    </div>
  </div>
  <div class="scroll">
    <div class="card" style="margin:0 16px 20px">
      ${list.map(t=>`
        <button class="row" onclick="openThread(${t.id})">
          <span class="avatar sm" style="background:${deptColor(t.dept)}">${ic(deptIcon(t.dept),17,2)}</span>
          <span class="row-main">
            <span class="row-title">${t.subject}${t.unread?'<span class="unread-dot"></span>':''}</span>
            <span class="row-sub">${t.msgs.length?esc(t.msgs[t.msgs.length-1].t):'No messages yet'}</span>
            <span class="row-meta">
              <span class="badge ${t.state==='open'?'b-grn':'b-gry'}">${t.state}</span>
              <span class="small">${t.dept}</span>
            </span>
          </span>
          <span class="row-time">${t.when}</span>
        </button>`).join('') || emptyState('chat','No conversations','Nothing matches this filter.')}
    </div>
  </div>
  <button class="fab" aria-label="New conversation" onclick="newConversation()">${ic('plus',24,2.4)}</button>`;
};
/* Re-render, then restore focus AND caret position. Previously the caret
   was forced to the end, so editing mid-string was impossible. */
function liveFilter(el,key){
  const pos=el.selectionStart, id=el.id||'liveSearch';
  el.id=id; S[key]=el.value;
  render();
  const next=document.getElementById(id);
  if(next){ next.focus(); try{ next.setSelectionRange(pos,pos); }catch(e){} }
}
function deptColor(d){
  return {Compliance:'linear-gradient(145deg,#F04438,#B42318)',HSE:'linear-gradient(145deg,#17B26A,#067647)',
          Planning:'linear-gradient(145deg,#2E90FA,#175CD3)',Recruitment:'linear-gradient(145deg,#7F56D9,#5925DC)'}[d]||'var(--ink-700)';
}
function deptIcon(d){
  return {Compliance:'shield',HSE:'hard',Planning:'calendar',Recruitment:'user'}[d]||'chat';
}

function threadView(){
  const t=THREADS.find(x=>x.id===S.activeThread);
  return `
  <header class="appbar">
    ${backBtn("S.activeThread=null;render()")}
    <span class="avatar sm" style="background:${deptColor(t.dept)};margin-right:2px">${ic(deptIcon(t.dept),16,2)}</span>
    <div class="grow" style="min-width:0"><div class="ab-title" style="font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.subject}</div>
      <div class="ab-sub">${t.dept} · ${t.state}</div></div>
    <button class="icon-btn" onclick="toast('Conversation options.','info')">${ic('more',20)}</button>
  </header>
  <div class="chat-scroll" id="chatScroll">
    <span class="chat-day">Today</span>
    ${t.msgs.map(m=>`
      <div class="bub ${m.me?'me':'them'}">
        ${esc(m.t)}
        <div class="bub-time">${m.time}${m.me?ic('check',11,3):''}</div>
      </div>`).join('')}
  </div>
  <div class="composer">
    <input class="input grow" id="msgIn" placeholder="Write a message" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">${ic('send',18,2.2)}</button>
  </div>`;
}
function sendMsg(){
  const el=document.getElementById('msgIn'); const v=el.value.trim(); if(!v) return;
  const t=THREADS.find(x=>x.id===S.activeThread);
  t.msgs.push({me:true,t:v,time:'Now'});
  render();
  const sc=document.getElementById('chatScroll'); if(sc) sc.scrollTop=sc.scrollHeight;
  setTimeout(()=>{
    t.msgs.push({me:false,t:'Thanks — the '+t.dept.toLowerCase()+' team has picked this up and will come back to you shortly.',time:'Now'});
    render();
    const s2=document.getElementById('chatScroll'); if(s2) s2.scrollTop=s2.scrollHeight;
  },1400);
}

/* ---- new conversation ---- */
let NC={dept:'',cat:'',msg:''};
function askAboutJob(id){
  const j=JOBS.find(x=>x.id===id);
  newConversation(`I have a question about roster/job ${j.id} — ${j.title}.`);
}
function newConversation(prefill=''){
  NC={dept:'',cat:'',msg:prefill||''};
  openSheet({
    title:'New conversation',
    sub:'Send a question to the office team.',
    body:`
      <div class="field">
        <label class="label">Department <span class="req">*</span></label>
        <select class="sel ${NC.dept?'':'placeholder'}" id="ncDept" onchange="NC.dept=this.value;this.classList.toggle('placeholder',!this.value)">
          <option value="">Select a department</option>
          ${DEPTS.map(d=>`<option ${NC.dept===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="label">Category <span class="req">*</span></label>
        <input class="input" id="ncCat" placeholder="Short subject" value="${esc(NC.cat)}"
               maxlength="100" oninput="NC.cat=this.value;ncCount()">
        <div id="ncCatErr"></div>
        <div class="counter" id="ncCatCnt">${NC.cat.length} / 100</div>
      </div>
      <div class="field">
        <label class="label">Message <span class="req">*</span></label>
        <textarea class="input" id="ncMsg" maxlength="1000" placeholder="Describe what you need"
                  oninput="NC.msg=this.value;ncCount()">${esc(NC.msg)}</textarea>
        <div class="counter" id="ncMsgCnt">${NC.msg.length} / 1000</div>
      </div>`,
    foot:`<button class="btn btn-ghost grow" onclick="closeSheet()">Cancel</button>
          <button class="btn btn-primary grow" onclick="startConversation()">Start conversation</button>`
  });
}
function ncCount(){
  const c=document.getElementById('ncCatCnt'), m=document.getElementById('ncMsgCnt');
  if(c) c.textContent=`${NC.cat.length} / 100`;
  if(m) m.textContent=`${NC.msg.length} / 1000`;
  const err=document.getElementById('ncCatErr'), inp=document.getElementById('ncCat');
  if(NC.cat.length&&NC.cat.length<5){
    inp.classList.add('err');
    err.innerHTML=`<div class="err-msg">${ic('alert',13,2.4)} Category must be at least 5 characters</div>`;
  } else { inp.classList.remove('err'); err.innerHTML=''; }
}
function startConversation(){
  if(!NC.dept){ toast('Choose a department.','warn'); return; }
  if(NC.cat.trim().length<5){ ncCount(); toast('Category must be at least 5 characters.','warn'); return; }
  if(!NC.msg.trim()){ toast('Enter a message.','warn'); return; }
  const id=Math.max(...THREADS.map(t=>t.id))+1;
  THREADS.unshift({id,dept:NC.dept,subject:NC.cat,state:'open',unread:0,when:'Now',
    msgs:[{me:true,t:NC.msg,time:'Now'}]});
  closeSheet();
  setTimeout(()=>{ openTab('messages'); openThread(id); toast('Conversation started.','ok'); },320);
}
</script>

<script>
/* ============ TRAINING (empty state) ============ */
TABS.training=function(){

  ${appbar({ left:backToMore(), title:'Training schedule', sub:'Bookings and confirmations',

/* ============ UNAVAILABILITY ============ */
function setUnavFilter(k){ S.unavFilter=k; render(); }
const UNAV_FILTERS=[['all','All'],['Annual leave','Annual leave'],['Personal leave','Personal leave'],['Medical appointment','Medical'],['Other','Other']];
TABS.unavailability=function(){
  let list=S.unavFilter==='all'?UNAV:UNAV.filter(u=>u.reason===S.unavFilter);
  const lbl=(UNAV_FILTERS.find(f=>f[0]===S.unavFilter)||[])[1]||'All';
  return `
  ${appbar({ left:backToMore(), title:'Unavailability', sub:'Plan leave and rest days',
    })}
  <div class="filterbar">
    <span class="result-inline">${UNAV.length&&list.length!==UNAV.length?`Showing <b>${list.length}</b> of <b>${UNAV.length}</b>`:''}</span>
    <div class="grow"></div>
    ${ddFilter('unF','Reason',UNAV_FILTERS,S.unavFilter,'setUnavFilter')}
  </div>
  <div class="scroll">
    <div style="padding:0 16px 20px" class="stack gap12">
      ${list.map(u=>`
        <div class="job-card">
          <div class="job-top slate">
            <div class="grow">
              <div style="font-size:14px;font-weight:800;letter-spacing:-.025em">${u.reason}</div>
              <div class="job-site">${fmt(u.from[0],u.from[1],u.from[2])} – ${fmt(u.to[0],u.to[1],u.to[2])}</div>
            </div>
            ${ic('calendar',20)}
          </div>
          <div class="job-body">
            <div class="kv"><dt>When</dt><dd>${fmt(u.from[0],u.from[1],u.from[2])} – ${fmt(u.to[0],u.to[1],u.to[2])}</dd></div>
            <div class="kv"><dt>Reason</dt><dd>${u.reason}</dd></div>
            ${u.notes?`<div class="kv"><dt>Notes</dt><dd>${esc(u.notes)}</dd></div>`:''}
          </div>
          <div class="job-foot">
            <span class="grow"></span>
            <button class="circ-btn red" onclick="deleteUnav(${u.id})" title="Delete">${ic('trash',15)}</button>
            <button class="circ-btn blu" onclick="editUnav(${u.id})" title="Edit">${ic('edit',15)}</button>
          </div>
        </div>`).join('') ||
        (UNAV.length? emptyState('calendar','Nothing matches','No notices with this reason.')
                    : `<div class="empty" style="padding-top:60px">
                        <div class="empty-ic">${ic('calendar',28)}</div>
                        <h4>No availability notices</h4>
                        <p>Add the dates you cannot work and planning will see them straight away.</p>
                      </div>`)}

function deleteUnav(id){

  render(); toast('Availability notice deleted.','ok');
}
function editUnav(id){
  const u=UNAV.find(x=>x.id===id);
  S.range={start:u.from[0],end:u.to[0]}; S.editUnav=id; S.unavReason=u.reason; S.unavNotes=u.notes;
  openDatePicker(true);
}

/* ---- date range picker ---- */
S.dpMonth=5; S.dpYear=2026;
function openDatePicker(isEdit=false){
  if(!isEdit){ S.range={start:null,end:null}; S.editUnav=null; S.unavReason=''; S.unavNotes=''; }
  openSheet({
    title:isEdit?'Edit availability':'Add unavailability',
    sub:'Select the dates you are not available.',
    body:dpBody(),
    foot:`<button class="btn btn-ghost grow" onclick="closeSheet()">Cancel</button>
          <button class="btn btn-primary grow" onclick="saveUnav()">${isEdit?'Save changes':'Add notice'}</button>`
  });
}
function dpBody(){
  const m=S.dpMonth,y=S.dpYear;
  const total=daysInMonth(m,y), lead=firstDowMon(m,y);
  const prevTotal=daysInMonth(m===0?11:m-1,m===0?y-1:y);
  const cells=[];
  for(let i=lead-1;i>=0;i--) cells.push({n:prevTotal-i,out:true});
  for(let d=1;d<=total;d++) cells.push({n:d,out:false});
  while(cells.length%7) cells.push({n:1,out:true});
  const {start,end}=S.range;
  return `
    <div class="range-pill mb16">
      <div class="rp"><div class="rp-l">From</div><div class="rp-v ${start?'':'dim'}">${start?fmt(start,m,y):'Select'}</div></div>
      <span style="opacity:.4">${ic('arrowR',16)}</span>
      <div class="rp"><div class="rp-l">To</div><div class="rp-v ${end?'':'dim'}">${end?fmt(end,m,y):'Select'}</div></div>
    </div>
    <div class="dp-head">
      <button class="cal-arrow" aria-label="Previous month" onclick="dpStep(-1)">${ic('chevL',15,2.6)}</button>
      <span class="h3">${MONTHS[m]} ${y}</span>
      <button class="cal-arrow" aria-label="Next month" onclick="dpStep(1)">${ic('chevR',15,2.6)}</button>
    </div>
    <div class="dp-grid">
      ${DOW.map(d=>`<span class="dp-dow">${d[0]}</span>`).join('')}
      ${cells.map(c=>{
        if(c.out) return `<span class="dp-cell out">${c.n}</span>`;
        const inR = start&&end&&c.n>start&&c.n<end;
        const isS = start===c.n, isE = end===c.n;
        const cls = isS&&isE?'edge only':isS?'edge start':isE?'edge end':inR?'in-range':'';
        return `<button class="dp-cell ${cls}" onclick="dpPick(${c.n})">${c.n}</button>`;
      }).join('')}
    </div>
    <div class="field mt20">
      <label class="label">Reason <span class="req">*</span></label>
      <select class="sel ${S.unavReason?'':'placeholder'}" onchange="S.unavReason=this.value;this.classList.toggle('placeholder',!this.value)">
        <option value="">Select a reason</option>
        ${UNAV_REASONS.map(r=>`<option ${S.unavReason===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label class="label">Notes</label>
      <textarea class="input" style="min-height:66px" placeholder="Anything planning should know"
                oninput="S.unavNotes=this.value">${esc(S.unavNotes||'')}</textarea>
    </div>`;
}
function dpStep(n){
  let m=S.dpMonth+n,y=S.dpYear;
  if(m<0){m=11;y--} if(m>11){m=0;y++}
  S.dpMonth=m;S.dpYear=y;S.range={start:null,end:null};
  SHEET.cfg.body=dpBody(); updateSheetBody(SHEET.cfg.body);
}
function dpPick(d){
  const {start,end}=S.range;
  if(start===null||end!==null) S.range={start:d,end:null};
  else if(d<start) S.range={start:d,end:start};
  else S.range={start,end:d};
  SHEET.cfg.body=dpBody(); updateSheetBody(SHEET.cfg.body);
}
function saveUnav(){
  const {start,end}=S.range;
  if(!start){ toast('Select at least one date.','warn'); return; }
  if(!S.unavReason){ toast('Choose a reason.','warn'); return; }
  const rec={ id:S.editUnav||Date.now(), from:[start,S.dpMonth,S.dpYear], to:[end||start,S.dpMonth,S.dpYear],
              reason:S.unavReason, notes:S.unavNotes||'' };
  if(S.editUnav){ const i=UNAV.findIndex(u=>u.id===S.editUnav); UNAV[i]=rec; }
  else UNAV.unshift(rec);
  closeSheet(); toast(S.editUnav?'Availability updated.':'Availability notice added.','ok');
  S.editUnav=null;
}

function submitQual(){
